# tests/integration/setup is the reserved location for short-lived fixture
# infrastructure created and destroyed by the integration suites in the
# caller's own account; it is not a deployable pattern and is excluded from
# policy scanning.
skip-path:
  - tests/integration/setup

# The four checks below are verified false positives, not accepted risk.
# Checkov cannot statically resolve a nested optional() default on an
# object-typed root variable (registry.image_tag_mutability,
# registry.scan_on_push, session_store.point_in_time_recovery_enabled,
# session_store.billing_mode) once it is threaded through a count-based
# module call — confirmed by running Checkov directly against
# modules/registry and modules/session-store in isolation, where the
# identical defaults evaluate cleanly. The actual rendered resource
# attributes are asserted directly in tests/defaults.tftest.hcl
# ("platform_foundation_matches_the_live_contract") and in each submodule's
# own contract tests, which is the source of truth for this module's default
# posture. Re-run the isolation check yourself before removing this skip:
# `checkov -d modules/registry` / `checkov -d modules/session-store`.
#
# CKV_AWS_163, CKV_AWS_51, and CKV_AWS_28 were verified this way when the
# root and submodules first shipped. CKV2_AWS_16 (DynamoDB Auto Scaling) is
# a newer graph check, absent from the locally available Checkov 3.3.10 but
# present in the 3.3.19 the CI pipeline runs; it was verified the same way
# directly in CI, where the "modules/session-store" quality job (scanning
# the submodule in isolation) passed while "examples/minimal" (which reaches
# the table only through the root's module.session_store[0] call) failed on
# it. billing_mode defaults to PAY_PER_REQUEST, which scales automatically
# and needs no Application Auto Scaling target or policy; a caller who opts
# into billing_mode = "PROVISIONED" is choosing fixed capacity deliberately
# and may add their own aws_appautoscaling_target/policy beside the module
# call if they want it to scale.
skip-check:
  - CKV_AWS_163 # ECR image scanning on push — registry submodule defaults scan_on_push to true.
  - CKV_AWS_51 # ECR image tag immutability — registry submodule defaults image_tag_mutability to IMMUTABLE.
  - CKV_AWS_28 # DynamoDB point-in-time recovery — session-store submodule defaults point_in_time_recovery_enabled to true.
  - CKV2_AWS_16 # DynamoDB Auto Scaling — session-store submodule defaults billing_mode to PAY_PER_REQUEST, which needs no autoscaling.
