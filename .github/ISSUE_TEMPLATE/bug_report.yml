name: Bug report
description: A resource, validation, or output behaves differently from what the module documents.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Redact account IDs, ARNs, and secrets before pasting configuration or output.
  - type: input
    id: module-version
    attributes:
      label: Module version or commit
      description: The tag or commit SHA pinned in your module `source` / `ref`.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      description: Output of `terraform version`.
      placeholder: 1.7.5
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: AWS provider version
      description: The `hashicorp/aws` version recorded in your `.terraform.lock.hcl`.
      placeholder: 6.66.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - cluster, KMS key, or log group (main.tf, locals.tf)
        - private endpoints (module.endpoints)
        - registry submodule (modules/registry)
        - session-store submodule (modules/session-store)
        - advisory checks (checks.tf)
        - examples
        - integration suites
        - not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest module call that reproduces the problem.
      render: hcl
      placeholder: |
        module "platform" {
          source = "git::https://github.com/hatan4ik/aws.modules.ecs.git?ref=v1.0.0"

          name                     = "sandbox-platform"
          vpc_id                   = "vpc-0123456789abcdef0"
          vpc_cidr                 = "10.64.0.0/16"
          private_subnet_ids       = ["subnet-0123456789abcdef0", "subnet-0123456789abcdef1"]
          private_route_table_ids  = ["rtb-0123456789abcdef0", "rtb-0123456789abcdef1"]
          log_retention_in_days    = 30
          tags                     = { Environment = "sandbox" }
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Plan or apply output
      description: Relevant `terraform plan` or `terraform apply` output, with account IDs and ARNs redacted.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I redacted account IDs, ARNs, and secrets from everything above.
          required: true
        - label: I searched existing issues for this problem.
          required: true
