name: Feature request
description: Propose a new input, output, or behaviour for the module.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do with the module today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Proposed interface
      description: The variables, outputs, or resources you expect, written as HCL.
      render: hcl
      placeholder: |
        variable "example" {
          description = "..."
          type        = string
          default     = null
        }
    validations:
      required: true
  - type: dropdown
    id: submodule
    attributes:
      label: Where does it belong?
      options:
        - cluster, KMS key, or log group (main.tf, locals.tf)
        - private endpoints (module.endpoints)
        - registry submodule (modules/registry)
        - session-store submodule (modules/session-store)
        - advisory checks (checks.tf)
        - a new example
        - an integration suite
        - not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, such as bring-your-own inputs or wrapping the module.
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: The proposal does not require the module to add data sources beyond what identity and region resolution already need.
        - label: The proposal is backwards compatible, or the breaking change is called out above.
        - label: The proposal does not reintroduce identity (Cognito) or another concern this module deliberately does not own (see docs/DESIGN.md).
